appId: ai.ciro.desktop
productName: Ciro
asar: true
npmRebuild: false
publish: null
directories:
  output: release
files:
  - dist/**/*
  - desktop/**/*
  - server/**/*
  - package.json
  - node_modules/**/*
  - "!**/node_modules/**/{test,tests,docs,example,examples}/**"
  - "!**/*.map"
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: "Ciro-Desktop-${version}-${arch}-Setup.${ext}"
portable:
  artifactName: "Ciro-Desktop-${version}-${arch}-Portable.${ext}"
