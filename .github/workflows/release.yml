name: Release desktop apps and packages
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.9.0"
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.RELEASE_TAG }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  desktop:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: --linux
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.RELEASE_TAG }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Package installers
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Desktop launch smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          CIRO_DESKTOP_SMOKE=desktop-smoke.png timeout 90 xvfb-run -a release/linux-unpacked/ciro-client --no-sandbox
          test -s desktop-smoke.png
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
            desktop-smoke.png
          if-no-files-found: error

  container:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.RELEASE_TAG }}" }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ciro-client:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/ciro-client:latest

  npm-package:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.RELEASE_TAG }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@kllcoco"
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm run pack:npm
      - name: Publish @kllcoco/ciro-client to GitHub Packages
        working-directory: build/npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm pack
        working-directory: build/npm
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: build/npm/*.tgz

  publish:
    needs: [desktop, container, npm-package]
    if: always() && needs.desktop.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.RELEASE_TAG }}" }
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Checksums
        run: |
          cd out
          rm -f desktop-smoke.png
          sha256sum * > SHA256SUMS.txt
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Ciro ${{ env.RELEASE_TAG }}
          body_path: docs/RELEASE_NOTES.md
          files: out/*
