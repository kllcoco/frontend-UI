<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f5ef" />
    <meta name="description" content="Ciro — Think further. AI 对话工作台。" />
    <link rel="icon" type="image/svg+xml" href="/ciro-mark.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Ciro — 让每一个想法，走得更远</title>
    <!-- Launch: paint the saved theme and the logo before any script, then crossfade into the app. -->
    <script>
      try {
        var p = localStorage.getItem("ciro.theme.v1");
        var dark = p === "dark" || (p === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (e) {}
      // The desktop pet window and the Android floating pet load this page too: transparent from the first frame,
      // never the launch logo or the app background.
      if (/[?&]pet=1(&|$)/.test(location.search)) document.documentElement.className += " pet-page";
    </script>
    <style>
      html { background: #f8f5ef; } html[data-theme="dark"] { background: #15120f; }
      html.pet-page, html.pet-page body { background: transparent !important; } html.pet-page #ciro-boot { display: none !important; }
      #ciro-boot { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: inherit;
        transition: opacity .42s cubic-bezier(.2,.7,.2,1), visibility .42s; }
      #ciro-boot svg { width: 64px; height: 64px; animation: ciro-boot 1.6s cubic-bezier(.4,0,.2,1) infinite; }
      #ciro-boot .b { stop-color: #8a6224; } #ciro-boot .a { stop-color: #d6ad62; } #ciro-boot .s { fill: #b98a3a; }
      html[data-theme="dark"] #ciro-boot .a { stop-color: #f5dfa8; } html[data-theme="dark"] #ciro-boot .b { stop-color: #b58a43; } html[data-theme="dark"] #ciro-boot .s { fill: #fbe9c0; }
      html.ciro-ready #ciro-boot { opacity: 0; visibility: hidden; pointer-events: none; }
      html.ciro-ready #ciro-boot svg { transform: scale(.86); transition: transform .42s cubic-bezier(.2,.7,.2,1); animation: none; }
      @keyframes ciro-boot { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.94); opacity: .82; } }
      @media (prefers-reduced-motion: reduce) { #ciro-boot svg { animation: none; } }
    </style>
  </head>
  <body>
    <div id="ciro-boot" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none"><defs><linearGradient id="cb" x1="10" y1="8" x2="52" y2="58" gradientUnits="userSpaceOnUse">
        <stop class="a"/><stop offset="1" class="b"/></linearGradient></defs>
        <path d="M48.5 17.5A22 22 0 1 0 48.5 46.5" stroke="url(#cb)" stroke-width="8.5" stroke-linecap="round"/><path class="s" d="M51 23.5C51.6 29.4 53.6 31.4 59.5 32C53.6 32.6 51.6 34.6 51 40.5C50.4 34.6 48.4 32.6 42.5 32C48.4 31.4 50.4 29.4 51 23.5Z"/></svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
